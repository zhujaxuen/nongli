<!DOCTYPE html>
<html lang="pt-BR" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Dois Calendários</title>
<style>
  :root{
    --ink: #12182B;
    --ink-2: #182140;
    --panel-sun: #1B2440;
    --panel-moon: #241A28;
    --sun: #D8A947;
    --sun-dim: #8a742f;
    --moon: #B23A48;
    --moon-dim: #7a2b34;
    --jade: #4F8A7A;
    --paper: #F1E9D9;
    --muted: #9AA3BD;
    --line: rgba(241,233,217,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 20% -10%, #1c2547 0%, var(--ink) 45%) fixed;
    color: var(--paper);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    min-height: 100vh;
    padding: 32px 18px 60px;
  }
  body[data-lang="zh"]{ font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif; }
  .wrap{ max-width: 920px; margin: 0 auto; }

  /* ---- language switcher: compact corner button ---- */
  .lang-corner{
    position: fixed; top: 16px; right: 16px; z-index: 50;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .lang-btn{
    display:flex; align-items:center; gap: 6px;
    background: rgba(18,24,43,0.85); backdrop-filter: blur(6px);
    border: 1px solid var(--line); color: var(--paper);
    padding: 7px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
  }
  .lang-btn:hover{ border-color: var(--jade); }
  .lang-btn .chevron{ font-size: 9px; color: var(--muted); transition: transform .15s ease; }
  .lang-corner.open .lang-btn .chevron{ transform: rotate(180deg); }
  .lang-menu{
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 6px; min-width: 140px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: none; flex-direction: column; gap: 2px;
  }
  .lang-corner.open .lang-menu{ display: flex; }
  .lang-menu button{
    background: transparent; border: none; color: var(--muted);
    text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .lang-menu button:hover{ background: rgba(241,233,217,0.06); color: var(--paper); }
  .lang-menu button.active{ color: var(--jade); font-weight: 600; }
  @media (max-width: 640px){
    .lang-corner{ top: 10px; right: 10px; }
  }

  header{ text-align:center; margin-bottom: 34px; }
  header .eyebrow{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12.5px; letter-spacing: 0.14em; color: var(--muted);
    margin-bottom: 10px; text-transform: none;
  }
  header h1{
    font-size: 34px; margin: 0 0 10px; font-weight: 400;
    letter-spacing: 0.01em;
  }
  header h1 .sol{ color: var(--sun); }
  header h1 .lua{ color: var(--moon); }
  header p{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: var(--muted); font-size: 14.5px; max-width: 560px; margin: 0 auto; line-height:1.6;
  }

  /* ---- today strip ---- */
  .today-strip{
    display:flex; align-items:center; justify-content:center; gap:18px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13.5px; color: var(--muted);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 12px 0; margin-bottom: 34px; flex-wrap: wrap; text-align:center;
  }
  .today-strip b{ color: var(--paper); font-weight: 600; }
  .today-strip .sep{ color: var(--line); }

  /* ---- mode toggle ---- */
  .mode-toggle{
    display:flex; justify-content:center; gap: 8px; margin-bottom: 26px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .mode-toggle button{
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    padding: 9px 18px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: all .18s ease;
  }
  .mode-toggle button.active{
    border-color: var(--sun); color: var(--ink); background: var(--sun);
    font-weight: 600;
  }
  .mode-toggle button:not(.active):hover{ border-color: var(--paper); color: var(--paper); }

  /* ---- two panel grid ---- */
  .stage{
    position: relative;
    display: grid;
    grid-template-columns: 1fr 64px 1fr;
    align-items: stretch;
    gap: 0;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  @media (max-width: 640px){
    .stage{ grid-template-columns: 1fr; }
    .connector{ display:none; }
  }

  .panel{ padding: 30px 26px; }
  .panel-sun{ background: linear-gradient(160deg, var(--panel-sun), #141b34); }
  .panel-moon{ background: linear-gradient(200deg, var(--panel-moon), #1a1320); }

  .panel-label{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11.5px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 18px;
  }
  .panel-sun .panel-label{ color: var(--sun); }
  .panel-moon .panel-label{ color: var(--moon); }

  .connector{
    background: var(--ink-2); display:flex; align-items:center; justify-content:center;
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    font-size: 20px; color: var(--muted);
  }

  label{
    display:block; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px; color: var(--muted); margin: 14px 0 6px;
  }
  label:first-of-type{ margin-top: 0; }

  input[type="date"], select{
    width: 100%; background: rgba(241,233,217,0.06); border: 1px solid var(--line);
    color: var(--paper); padding: 10px 12px; border-radius: 8px; font-size: 15px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  input[type="date"]{ color-scheme: dark; }
  select:disabled{ opacity: 0.35; }

  .checkbox-row{
    display:flex; align-items:center; gap: 8px; margin-top: 14px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13px; color: var(--muted);
  }
  .checkbox-row input{ accent-color: var(--moon); }

  .result-big{ font-size: 26px; line-height: 1.35; margin: 4px 0 6px; }
  .result-sub{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13.5px; color: var(--muted); line-height: 1.6;
  }
  .weekday{ color: var(--sun); }
  .zodiac-row{ display:flex; align-items:baseline; gap: 10px; margin-top: 14px; flex-wrap:wrap; }
  .zodiac-badge{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px; border: 1px solid var(--moon-dim); color: var(--moon);
    padding: 4px 10px; border-radius: 999px; letter-spacing: 0.03em;
  }
  .ganzhi-note{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px; color: var(--muted); margin-top: 4px;
  }

  .error-msg{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13px; color: var(--moon); margin-top: 14px; line-height: 1.5;
  }

  footer{
    text-align:center; margin-top: 30px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11.5px; color: var(--muted); opacity: 0.7; line-height: 1.7;
  }

  /* ---- extra sections ---- */
  .extra{ margin-top: 64px; }
  .extra-head{
    display:flex; align-items:baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin-bottom: 20px;
  }
  .extra h2{
    font-size: 22px; font-weight: 400; margin: 0; letter-spacing: 0.01em;
  }
  .extra h2 .dot{ color: var(--sun); }
  .extra p.lead{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13.5px; color: var(--muted); line-height: 1.6; margin: 0 0 22px;
    max-width: 620px;
  }
  .year-pick{
    display:flex; align-items:center; gap: 8px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12.5px; color: var(--muted);
  }
  .year-pick select{
    width: auto; padding: 6px 10px; font-size: 13px;
  }

  .festival-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .festival-card{
    background: rgba(241,233,217,0.04); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; border-left: 3px solid var(--moon-dim);
  }
  .festival-card .fname{
    font-size: 16.5px; margin-bottom: 6px;
  }
  .festival-card .flunar{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px; color: var(--moon); margin-bottom: 4px;
  }
  .festival-card .fdate{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13.5px; color: var(--paper); font-weight: 600;
  }
  .festival-card .fnote{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5;
  }

  .curio-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .curio-card{
    background: rgba(241,233,217,0.04); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 20px; border-left: 3px solid var(--sun-dim);
  }
  .curio-card h3{
    font-size: 16px; margin: 0 0 8px; font-weight: 400; color: var(--sun);
  }
  .curio-card p{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13px; color: var(--muted); line-height: 1.65; margin: 0;
  }

  .element-strip{
    display:flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;
  }
  .element-chip{
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--paper);
  }

  .zodiac-strip{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(90px,1fr));
    gap: 8px; margin-top: 10px;
  }
  .zodiac-chip{
    text-align:center; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12.5px; color: var(--paper); background: rgba(241,233,217,0.04);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px;
  }
  .zodiac-chip .zsub{ display:block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  /* ---- Chinese tear-off calendar card ---- */
  .lunar-card-wrap{
    max-width: 320px; margin: 22px auto 0;
  }
  .lunar-card{
    border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; background: var(--ink-2);
  }
  .lc-head{
    background: var(--moon-dim); padding: 8px 14px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .lc-tag{ color: var(--paper); font-size: 11px; letter-spacing: 0.08em; }
  .lc-sub{ color: var(--paper); opacity: 0.75; font-size: 11px; }
  .lc-day{
    text-align: center; padding: 20px 14px 4px;
    font-family: Georgia, 'Songti SC', 'STSong', 'Noto Serif SC', serif;
    font-size: 56px; line-height: 1; color: var(--sun);
  }
  .lc-meta{
    text-align: center; margin-top: 8px; font-size: 12.5px; color: var(--paper);
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .lc-era{
    text-align: center; margin-top: 4px; font-size: 11px; color: var(--muted);
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .lc-divider{ height: 1px; background: var(--line); margin: 14px 14px 0; }
  .lc-tags{
    display: flex; gap: 10px; padding: 14px 14px 14px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .lc-tag-col{ flex: 1; border-radius: 0 8px 8px 0; padding: 7px 10px; }
  .lc-yi{ background: rgba(79,138,122,0.14); border-left: 3px solid var(--jade); }
  .lc-ji{ background: rgba(178,58,72,0.14); border-left: 3px solid var(--moon); }
  .lc-tag-label{ font-size: 11px; font-weight: 600; margin-bottom: 3px; display: flex; align-items: baseline; gap: 5px; }
  .lc-yi .lc-tag-label{ color: var(--jade); }
  .lc-ji .lc-tag-label{ color: var(--moon); }
  .lc-tag-gloss{ font-size: 10px; font-weight: 400; color: var(--muted); }
  .lc-tag-items{ font-size: 11.5px; color: var(--paper); opacity: 0.85; }

  select option{
    color: #12182B;
    background-color: #F1E9D9;
  }
</style>
</head>
<body id="bodyRoot">

    <button class="lang-btn" id="langBtn" type="button">
      <span id="langBtnLabel">PT</span><span class="chevron">▾</span>
    </button>
    <div class="lang-menu" id="langMenu">

  <header>
    <div class="eyebrow" id="tEyebrow"></div>

  <div class="mode-toggle">

  <div class="stage">

  <footer id="tFooter"></footer>

</div>

<script>
/* ===================== CONVERSION CORE ===================== */
// ---- Chinese Lunisolar <-> Gregorian conversion core (data table covers 1900-2100) ----
function base64ToBit(base64Str) {
    const base64CodeMap = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const result = [];
    for (let i = 0; i < base64Str.length; i++) {
        let n = base64CodeMap.indexOf(base64Str[i]);
        result.push(n.toString(2).padStart(6, '0'));
    }
    return result.join('');
}

function checkDate(year, month, date) {
    if (year < 1901 || year > 2100) {
        throw new Error('Invalid Year');
    }
    if (month < 1 || month > 12) {
        throw new Error('Invalid Month');
    }
    if (date < 1 || date > 31) {
        throw new Error('Invalid Date');
    }
    if ([4, 6, 9, 11].indexOf(month) != -1 && date > 30) {
        throw new Error('Invalid Date');
    }
    if (month == 2) {
        if (date > 29) {
            throw new Error('Invalid Date');
        } else {
            let isLeap = false;
            if (year % 400 == 0) {
                isLeap = true
            } else if (year % 4 == 0 && year % 100 != 0) {
                isLeap = true;
            }
            if (!isLeap && date > 28) {
                throw new Error('Invalid Date');
            }
        }
    }
}


const table = [];
const heavenlyStemStr = '甲乙丙丁戊己庚辛壬癸';
const earthlyBranchStr = '子丑寅卯辰巳午未申酉戌亥';
const zodiacStr = '鼠牛虎兔龙蛇马羊猴鸡狗猪';
const lunarMonthStr = '正二三四五六七八九十冬腊';
const nubmerStr = '一二三四五六七八九十';

function decompressData() {
    const base64Str = 'hLaCVwUrqpNDSYNlUaqgrUE1pJXQSuak2FJoaSrqlC1QNailtBK26TcElwpLWyWDUoNqJW1ArYJVySXgkuzJYNSg6lVtSC1oFbHJuCS58loZKhqU20oLVQVqSq2BLoSWlkrCpV7SoNlBaqqrUE2gpbNSuClcVKg6VBqpq1QVaglslK4KVwUmPpMGyrrVQVqCW1UroJWhSamk0NJY1ShaoFtTS2glbBJtKS4Ul1ZLBqUG1GraBVsEq6pLwSXBks2pQdSw1lBawKtlk2hJcGSyalQ1KDaUlqoK1PVbAl0JLVyVhUqFpSWqgrVlVqCXQUtspXBSsKk0dKg1UFapJtQS2alcFJwaTL0mDVMFqja1BLbaV0ErQpNbSWGkoapLtUC1oFbSStgk29JcKSwqlW1KDaQVtGq2CTeEl4JLgyWzUoOpQaqSrYFVwSXHkuDJZ9SoalBtKq1UFagptRS6ClsVKwqVC0prVQVqgq0lLoKWwUrOpODSbuUwaqCtVU2oJbBSuik4NFo6TBqkG1TNagVtBK5KToUWhoqWyUNUg';
    const bitStr = base64ToBit(base64Str);
    let solarDate = { y: 1900, m: 1, d: 31, obj: new Date(Date.UTC(1900, 0, 31)) };
    let heavenlyStem = 6; // 天干
    let earthlyBranch = 0; // 地支
    for (let i = 0; i < bitStr.length; ) {
        if (i + 16 >= bitStr.length) {
            break;
        }
        const head = bitStr.substr(i, 4);
        i += 4;
        const leapMonth = +`0b${head}`;
        const monthCount = leapMonth > 0 ? 13 : 12;
        const months = bitStr.substr(i, monthCount).split('').map(o => +o);
        i += monthCount;

        table.push({
            solarDate,
            leapMonth,
            months,
            heavenlyStem,
            earthlyBranch
        });

        const dateCount = monthCount*29 + months.filter(o => o == 1).length;
        const newSolarDate = new Date(Date.UTC(solarDate.y, solarDate.m - 1, solarDate.d + dateCount));
        solarDate = {
            y: newSolarDate.getUTCFullYear(),
            m: newSolarDate.getUTCMonth() + 1,
            d: newSolarDate.getUTCDate(),
            obj: newSolarDate
        };
        heavenlyStem = (heavenlyStem + 1) % 10;
        earthlyBranch = (earthlyBranch + 1) % 12;
    }
}

decompressData();

function isBefore(base, target) {
    if (base.y != target.y) {
        return base.y > target.y;
    } else if (base.m != target.m) {
        return base.m > target.m;
    } else if (base.d != target.d) {
        return base.d > target.d;
    }
    return false;
}

function getLunarStr(month, date, isLeap) {
    const monthStr = `${isLeap ? '闰' : ''}${lunarMonthStr[month - 1]}月`;
    if (date <= 10) {
        return `${monthStr}初${nubmerStr[date - 1]}`;
    } else if (date < 20) {
        return `${monthStr}十${nubmerStr[date - 11]}`;
    } else if (date == 20) {
        return `${monthStr}廿十`;
    } else if (date > 20) {
        return `${monthStr}廿${nubmerStr[date - 21]}`;
    } else {
        return `${monthStr}三十`;
    }
}

function getLunar(year, month, date) {
    year = Math.floor(+year);
    month = Math.floor(+month);
    date = Math.floor(+date);
    checkDate(year, month, date);
    let index = year - 1900;
    let row = table[index];
    if (isBefore(row.solarDate, { y: year, m: month, d: date })) {
        index -= 1;
        row = table[index];
    }
    if (!row) {
        throw new Error('Invalid Date');
    }
    const targetDate = new Date(Date.UTC(year, month - 1, date));
    let delta = Math.round((targetDate.getTime() - row.solarDate.obj.getTime()) / (24*60*60*1000));
    let afterLeap = false;
    for(let i = 0; i < row.months.length; i++) {
        const isLeap = row.leapMonth > 0 && i == row.leapMonth;
        if (isLeap) {
            afterLeap = true;
        }
        const days = 29 + row.months[i];
        if (delta < days) {
            let lunarMonth = afterLeap ? i : i + 1;
            return {
                lunarMonth,
                lunarDate: delta + 1,
                isLeap,
                lunarYear: `${heavenlyStemStr[row.heavenlyStem]}${earthlyBranchStr[row.earthlyBranch]}年`,
                lunarYearNum: index + 1900,
                zodiac: `${zodiacStr[row.earthlyBranch]}`,
                dateStr: getLunarStr(lunarMonth, delta + 1, isLeap)
            };
        } else {
            delta -= days;
        }
    }
    throw new Error(`There's something wrong!`);
}



function monthArrayIndex(row, month, isLeap) {
    // Internal months[] array has 13 slots in a leap year (one extra for the
    // inserted month). A normal month that comes AFTER the leap month is
    // therefore shifted one slot to the right compared to its own number.
    if (isLeap) {
        if (row.leapMonth !== month) {
            throw new Error('Este ano não tem mês intercalar ' + month);
        }
        return month;
    }
    if (row.leapMonth > 0 && month > row.leapMonth) {
        return month;
    }
    return month - 1;
}

function lunarToSolar(year, month, day, isLeap) {
    year = Math.floor(+year);
    month = Math.floor(+month);
    day = Math.floor(+day);
    const row = table[year - 1900];
    if (!row) {
        throw new Error('Ano fora do intervalo suportado (1900-2100)');
    }
    const targetIndex = monthArrayIndex(row, month, isLeap);
    const maxDay = 29 + row.months[targetIndex];
    if (day < 1 || day > maxDay) {
        throw new Error('Dia inválido para este mês lunar (max ' + maxDay + ')');
    }
    let offset = 0;
    for (let i = 0; i < targetIndex; i++) {
        offset += 29 + row.months[i];
    }
    offset += (day - 1);
    const base = row.solarDate.obj;
    const result = new Date(base.getTime() + offset * 24 * 60 * 60 * 1000);
    return {
        year: result.getUTCFullYear(),
        month: result.getUTCMonth() + 1,
        day: result.getUTCDate()
    };
}

function getYearMeta(year) {
    const row = table[year - 1900];
    if (!row) return null;
    return {
        leapMonth: row.leapMonth,
        heavenlyStem: row.heavenlyStem,
        earthlyBranch: row.earthlyBranch,
        zodiac: zodiacStr[row.earthlyBranch],
        ganzhi: `${heavenlyStemStr[row.heavenlyStem]}${earthlyBranchStr[row.earthlyBranch]}`,
        daysInMonth: (m, leap) => {
            const idx = monthArrayIndex(row, m, leap);
            return 29 + row.months[idx];
        }
    };
}

/* ---- language detection: query param > path segment > browser > default ---- */
function detectLang(){
  try{
    const params = new URLSearchParams(window.location.search);
    const q = (params.get('lang') || '').toLowerCase();
    if (['zh','pt','en'].includes(q)) return q;

    const path = window.location.pathname.toLowerCase();
    const segs = path.split('/').filter(Boolean);
    const zhHints = ['zh','china','cn','chinese','zhongwen'];
    const enHints = ['en','english'];
    const ptHints = ['pt','pt-br','portugues','português','br'];
    for (const s of segs){
      if (zhHints.includes(s)) return 'zh';
      if (enHints.includes(s)) return 'en';
      if (ptHints.includes(s)) return 'pt';
    }

    const nav = (navigator.language || 'pt').toLowerCase();
    if (nav.startsWith('zh')) return 'zh';
    if (nav.startsWith('en')) return 'en';
    if (nav.startsWith('pt')) return 'pt';
  }catch(e){ /* ignore */ }
  return 'pt';
}

let currentLang = detectLang();
let L = I18N[currentLang];

function setLang(lang){
  currentLang = lang;
  L = I18N[lang];
  document.getElementById('htmlRoot').setAttribute('lang', L.htmlLang);
  document.getElementById('bodyRoot').setAttribute('data-lang', lang);
  document.getElementById('pageTitle').textContent = L.pageTitle;

  try{
    const url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.history.replaceState({}, '', url);
  }catch(e){ /* ignore */ }

  document.querySelectorAll('#langMenu button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.getElementById('langBtnLabel').textContent = lang.toUpperCase();
  document.getElementById('langCorner').classList.remove('open');

  renderStatic();
  renderMode();
  renderToday();
  renderFestivals();
  renderCuriosities();
}

/* ---- helpers ---- */
function ganzhiLabel(stemIdx, branchIdx){
  const animal = L.zodiac[branchIdx];
  const element = L.elements[Math.floor(stemIdx/2)];
  const chars = heavenlyStemStr[stemIdx] + earthlyBranchStr[branchIdx];
  const pinyin = STEM_PINYIN[stemIdx] + ' ' + BRANCH_PINYIN[branchIdx];
  return { animal, element, chars, pinyin, full: L.ganzhiFull(animal, element, chars) };
}
const STEM_PINYIN = ['Jiǎ','Yǐ','Bǐng','Dīng','Wù','Jǐ','Gēng','Xīn','Rén','Guǐ'];
const BRANCH_PINYIN = ['Zǐ','Chǒu','Yín','Mǎo','Chén','Sì','Wǔ','Wèi','Shēn','Yǒu','Xū','Hài'];

function formatGregorian(y,m,d){
  const dt = new Date(Date.UTC(y, m-1, d));
  const weekday = L.weekdays[dt.getUTCDay()];
  return { weekday, text: L.dateFmt(d, L.months[m-1], y) };
}

function lunarDayGlyph(date){
  if (date <= 10) return `初${nubmerStr[date - 1]}`;
  if (date < 20) return `十${nubmerStr[date - 11]}`;
  if (date == 20) return `廿十`;
  if (date > 20) return `廿${nubmerStr[date - 21]}`;
  return `三十`;
}

  if (currentLang === 'zh'){

  return `${L.lunarMonthDay(month, isLeap)} · ${L.yearOf(gz.full)}`;
}

      <div class="lc-head">
        <span class="lc-tag">${L.lunarCardLabel}</span>
        <span class="lc-sub">${gregorianText} · ${weekday}</span>
      </div>
      <div class="lc-day">${lunarDayGlyph(day)}</div>
      <div class="lc-meta">${lunarCardMetaLine(month, isLeap, gz)}</div>
      ${eraLine}
      <div class="lc-divider"></div>
      <div class="lc-tags">
        <div class="lc-tag-col lc-yi">
          <div class="lc-tag-label">宜${yiGloss}</div>
          <div class="lc-tag-items">祭祀 · 出行 · 祈福</div>
        </div>
        <div class="lc-tag-col lc-ji">
          <div class="lc-tag-label">忌${jiGloss}</div>
          <div class="lc-tag-items">动土 · 嫁娶</div>
        </div>
      </div>
    </div>
  `;
}

function translateError(e){
  const msg = e.message || '';
  if (msg.indexOf('intervalo') !== -1 || msg.indexOf('range') !== -1) return L.errors.outOfRange;
  const noLeapMatch = msg.match(/(\d+)/);
  if (msg.indexOf('intercalar') !== -1 || msg.indexOf('leap month') !== -1) {
    return L.errors.noLeap(noLeapMatch ? noLeapMatch[1] : '');
  }
  if (msg.indexOf('inválido') !== -1 || msg.indexOf('Invalid') !== -1 || msg.indexOf('max') !== -1) {
    return L.errors.invalidDay(noLeapMatch ? noLeapMatch[1] : '');
  }
  return msg;
}

/* ---- static text ---- */
function renderStatic(){
  document.getElementById('tEyebrow').textContent = L.eyebrow;
  document.getElementById('tTitle').innerHTML =
    `<span class="sol">${L.titleSun}</span> ${L.titleAmp} <span class="lua">${L.titleMoon}</span>`;
  document.getElementById('tLead').textContent = L.lead;
  document.getElementById('lblSun').textContent = L.panelSun;
  document.getElementById('lblMoon').textContent = L.panelMoon;
  document.getElementById('tFestHeading').innerHTML = `${L.festHeading.replace(/\.$/,'')}<span class="dot">.</span>`;
  document.getElementById('tFestLead').textContent = L.festLead;
  document.getElementById('tFestYearLabel').textContent = L.festYearLabel;
  document.getElementById('tCurioHeading').innerHTML = `${L.curioHeading.replace(/\.$/,'')}<span class="dot">.</span>`;
  document.getElementById('tCurioLead').textContent = L.curioLead;
  document.getElementById('tFooter').innerHTML = `${L.footerL1}<br>${L.footerL2}`;
  modeGtoC.textContent = L.modeGtoC;
  modeCtoG.textContent = L.modeCtoG;
}

/* ---- today strip ---- */
function renderToday(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  try{
    const lunar = getLunar(y,m,d);
    const g = ganzhiLabel(
      heavenlyStemStr.indexOf(lunar.lunarYear[0]),
      earthlyBranchStr.indexOf(lunar.lunarYear[1])
    );
    const lunarPart = currentLang === 'zh'
      ? lunar.dateStr
      : L.lunarMonthDay(lunar.lunarMonth, lunar.isLeap) + `, ` + L.lunarDayOf(lunar.lunarDate).toLowerCase();
    document.getElementById('todayStrip').innerHTML =
      `${L.todayLabel}: <b>${formatGregorian(y,m,d).text}</b> <span class="sep">·</span> `+
      `<b>${lunarPart}</b> <span class="sep">·</span> ${L.yearOf(g.full)}`;
  }catch(e){
    document.getElementById('todayStrip').textContent = formatGregorian(y,m,d).text;
  }
}

/* ---- mode state ---- */
let mode = 'gtoc';
const modeGtoC = document.getElementById('modeGtoC');
const modeCtoG = document.getElementById('modeCtoG');
const sunInputs = document.getElementById('sunInputs');
const sunOutput = document.getElementById('sunOutput');
const moonInputs = document.getElementById('moonInputs');
const moonOutput = document.getElementById('moonOutput');

function todayISO(){
  const n = new Date();
  const mm = String(n.getMonth()+1).padStart(2,'0');
  const dd = String(n.getDate()).padStart(2,'0');
  return `${n.getFullYear()}-${mm}-${dd}`;
}

function buildYearOptions(selectedYear){
  let opts = '';
  for(let y=2100; y>=1901; y--){
    opts += `<option value="${y}" ${y===selectedYear?'selected':''}>${y}</option>`;
  }
  return opts;
}

function renderMode(){
  modeGtoC.classList.toggle('active', mode==='gtoc');
  modeCtoG.classList.toggle('active', mode==='ctog');

  if(mode === 'gtoc'){
    sunInputs.innerHTML = `
      <label for="gDateInput">${L.chooseDate}</label>
      <input type="date" id="gDateInput" min="1901-01-01" max="2100-12-31" value="${todayISO()}">
    `;
    sunOutput.innerHTML = '';
    moonInputs.innerHTML = '';
    document.getElementById('gDateInput').addEventListener('input', computeGtoC);
    computeGtoC();
  } else {
    const now = new Date();
    moonInputs.innerHTML = `
      <label for="cYear">${L.yearRefLabel}</label>
      <select id="cYear">${buildYearOptions(now.getFullYear())}</select>
      <label for="cMonth">${L.lunarMonthLabel}</label>
      <select id="cMonth"></select>
      <label for="cDay">${L.lunarDayLabel}</label>
      <select id="cDay"></select>
      <div class="checkbox-row">
        <input type="checkbox" id="cLeap"> <label style="margin:0" for="cLeap">${L.leapCheckbox}</label>
      </div>
    `;
    moonOutput.innerHTML = '';
    sunInputs.innerHTML = '';
    document.getElementById('cYear').addEventListener('change', ()=>{ refreshMonthOptions(); computeCtoG(); });
    document.getElementById('cMonth').addEventListener('change', ()=>{ refreshDayOptions(); computeCtoG(); });
    document.getElementById('cDay').addEventListener('change', computeCtoG);
    document.getElementById('cLeap').addEventListener('change', ()=>{ refreshDayOptions(); computeCtoG(); });
    refreshMonthOptions();
    computeCtoG();
  }
}

function refreshMonthOptions(){
  const year = parseInt(document.getElementById('cYear').value, 10);
  const meta = getYearMeta(year);
  const monthSel = document.getElementById('cMonth');
  const leapCheckbox = document.getElementById('cLeap');
  const prevMonth = monthSel.value ? parseInt(monthSel.value,10) : 1;
  let opts = '';
  for(let m=1;m<=12;m++){
    opts += `<option value="${m}" ${m===prevMonth?'selected':''}>${L.monthOption(m)}</option>`;
  }
  monthSel.innerHTML = opts;
  leapCheckbox.disabled = !(meta.leapMonth > 0);
  if (leapCheckbox.disabled) leapCheckbox.checked = false;
  refreshDayOptions();
}

function refreshDayOptions(){
  const year = parseInt(document.getElementById('cYear').value, 10);
  const month = parseInt(document.getElementById('cMonth').value, 10);
  const meta = getYearMeta(year);
  const daySel = document.getElementById('cDay');

  if(document.getElementById('cLeap').checked && meta.leapMonth !== month){
    document.getElementById('cLeap').checked = false;
  }
  const effectiveLeap = document.getElementById('cLeap').checked;
  const maxDay = meta.daysInMonth(month, effectiveLeap);
  const prevDay = daySel.value ? parseInt(daySel.value,10) : 1;
  let opts = '';
  for(let d=1; d<=maxDay; d++){
    opts += `<option value="${d}" ${d===prevDay?'selected':''}>${d}</option>`;
  }
  daySel.innerHTML = opts;
}

function computeGtoC(){
  const val = document.getElementById('gDateInput').value;
  if(!val){ return; }
  const [y,m,d] = val.split('-').map(Number);
  const g = formatGregorian(y,m,d);
  sunOutput.innerHTML = `
    <div class="result-big">${g.text}</div>
    <div class="result-sub"><span class="weekday">${g.weekday}</span></div>
  `;
  try{
    const lunar = getLunar(y,m,d);
    const stemIdx = heavenlyStemStr.indexOf(lunar.lunarYear[0]);
    const branchIdx = earthlyBranchStr.indexOf(lunar.lunarYear[1]);
    const gz = ganzhiLabel(stemIdx, branchIdx);
    const headline = currentLang === 'zh' ? lunar.dateStr : L.lunarMonthDay(lunar.lunarMonth, lunar.isLeap);
    const sub = currentLang === 'zh' ? '' : `<div class="result-sub">${L.lunarDayOf(lunar.lunarDate)}</div>`;
    const ganzhiNote = currentLang === 'zh' ? '' : `<div class="ganzhi-note">${gz.chars} (${gz.pinyin}) ${L.ganzhiSuffix}</div>`;
    moonOutput.innerHTML = `
      <div class="result-big">${headline}</div>
      ${sub}
      <div class="zodiac-row"><span class="zodiac-badge">${L.yearOf(gz.full)}</span></div>
      ${ganzhiNote}
    `;
    document.getElementById('lunarCardWrap').innerHTML =
      tearOffCalendarCard(lunar.lunarMonth, lunar.lunarDate, lunar.isLeap, gz, g.text, g.weekday, lunar.lunarYearNum);
  }catch(e){
    moonOutput.innerHTML = `<div class="error-msg">${translateError(e)}</div>`;
    document.getElementById('lunarCardWrap').innerHTML = '';
  }
}

function computeCtoG(){
  const year = parseInt(document.getElementById('cYear').value, 10);
  const month = parseInt(document.getElementById('cMonth').value, 10);
  const day = parseInt(document.getElementById('cDay').value, 10);
  const isLeap = document.getElementById('cLeap').checked;
  const meta = getYearMeta(year);
  const gz = ganzhiLabel(meta.heavenlyStem, meta.earthlyBranch);

  const headline = currentLang === 'zh'
    ? getLunarStr(month, day, isLeap)
    : `${L.lunarMonthDay(month, isLeap)}, ${L.lunarDayOf(day).toLowerCase()}`;
  const ganzhiNote = currentLang === 'zh' ? '' : `<div class="ganzhi-note">${gz.chars} (${gz.pinyin})</div>`;

  moonOutput.innerHTML = `
    <div class="result-big">${headline}</div>
    <div class="zodiac-row"><span class="zodiac-badge">${L.yearOf(gz.full)}</span></div>
    ${ganzhiNote}
  `;
  try{
    const solar = lunarToSolar(year, month, day, isLeap);
    const g = formatGregorian(solar.year, solar.month, solar.day);
    sunOutput.innerHTML = `
      <div class="result-big">${g.text}</div>
      <div class="result-sub"><span class="weekday">${g.weekday}</span></div>
    `;
    document.getElementById('lunarCardWrap').innerHTML =
      tearOffCalendarCard(month, day, isLeap, gz, g.text, g.weekday, year);
  }catch(e){
    sunOutput.innerHTML = `<div class="error-msg">${translateError(e)}</div>`;
    document.getElementById('lunarCardWrap').innerHTML = '';
  }
}

modeGtoC.addEventListener('click', ()=>{ mode='gtoc'; renderMode(); });
modeCtoG.addEventListener('click', ()=>{ mode='ctog'; renderMode(); });

/* ===================== SPECIAL DATES / FESTIVALS ===================== */
const FESTIVAL_DATES = [ [1,1], [1,15], [5,5], [7,7], [8,15], [9,9], [12,8] ];

function buildFestivalYearOptions(){
  let opts = '';
  const current = new Date().getFullYear();
  for(let y=2100; y>=1901; y--){
    opts += `<option value="${y}" ${y===current?'selected':''}>${y}</option>`;
  }
  return opts;
}

function renderFestivals(){
  let sel = document.getElementById('festYear');
  if (!sel.options.length) sel.innerHTML = buildFestivalYearOptions();
  const year = parseInt(sel.value, 10);
  const grid = document.getElementById('festivalGrid');
  grid.innerHTML = L.festivals.map((f, i) => {
    const [month, day] = FESTIVAL_DATES[i];
    let dateHtml;
    try{
      const solar = lunarToSolar(year, month, day, false);
      const g = formatGregorian(solar.year, solar.month, solar.day);
      dateHtml = `${g.text} <span style="color:var(--muted); font-weight:400;">(${g.weekday})</span>`;
    }catch(e){
      dateHtml = translateError(e);
    }
    const lunarLabel = currentLang === 'zh'
      ? getLunarStr(month, day, false)
      : L.lunarMonthDay(month, false) + ', ' + L.lunarDayOf(day).toLowerCase();
    return `
      <div class="festival-card">
        <div class="fname">${f.name}</div>
        <div class="flunar">${lunarLabel}</div>
        <div class="fdate">${dateHtml}</div>
        <div class="fnote">${f.note}</div>
      </div>
    `;
  }).join('');
}
document.getElementById('festYear').addEventListener('change', renderFestivals);

/* ===================== CURIOSITIES ===================== */
function renderCuriosities(){
  const grid = document.getElementById('curioGrid');
  grid.innerHTML = L.curiosities.map(c => {
    let extra = '';
    if (c.hasZodiacStrip){
      extra = `<div class="zodiac-strip">` + L.zodiac.map((name,i)=>
        `<div class="zodiac-chip">${name}<span class="zsub">${earthlyBranchStr[i]}</span></div>`
      ).join('') + `</div>`;
    }
    if (c.hasElementStrip){
      const chars = ['木','火','土','金','水'];
      extra = `<div class="element-strip">` + L.elements.map((name,i)=>
        `<span class="element-chip">${name} ${chars[i]}</span>`
      ).join('') + `</div>`;
    }
    return `<div class="curio-card"><h3>${c.title}</h3><p>${c.body}</p>${extra}</div>`;
  }).join('');
}

/* ===================== LANG SWITCH WIRING ===================== */
const langCorner = document.getElementById('langCorner');
document.getElementById('langBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  langCorner.classList.toggle('open');
});
document.querySelectorAll('#langMenu button').forEach(b=>{
  b.addEventListener('click', (e)=>{
    e.stopPropagation();
    setLang(b.dataset.lang);
  });
});
document.addEventListener('click', (e)=>{
  if (!langCorner.contains(e.target)) langCorner.classList.remove('open');
});

/* ===================== INIT ===================== */
setLang(currentLang);

</script>
